name: Build 26.2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set build version
        run: python3 tools/release/release.py version
      - run: python3 -m unittest discover -s tools/release/tests -v
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon "-Pmod_version=$MORPH_VERSION" build runGameTestServer
      - name: Verify optional NeoForge lab startup
        run: ./gradlew --no-daemon "-Pmod_version=$MORPH_VERSION" -PmorphLab=true labClasses runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: morph-neoforge-26.2-development
          path: build/libs/*.jar
          if-no-files-found: error
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set build version
        run: python3 tools/release/release.py version
      - run: chmod +x gradlew
        working-directory: fabric
      - run: ./gradlew --no-daemon "-Pmod_version=$MORPH_VERSION" build gametestClasses
        working-directory: fabric
      - uses: actions/upload-artifact@v4
        with:
          name: morph-fabric-26.2-development
          path: fabric/build/libs/*.jar
          if-no-files-found: error
  release:
    needs: [neoforge, fabric]
    if: >-
      github.repository == 'JulesB40/Morph' &&
      github.ref == 'refs/heads/codex/port-26.2' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set build version
        run: python3 tools/release/release.py version
      - uses: actions/download-artifact@v4
        with:
          pattern: morph-*-26.2-development
          path: build/release-input
          merge-multiple: true
      - name: Validate and package tested JARs
        run: python3 tools/release/release.py bundle
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/release.py publish
