plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}
version = '11.0.0-alpha.8'
group = 'me.ichun.mods.morph'
base { archivesName = 'Morph-Fabric-26.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Share only vanilla/model code; NeoForge entrypoints never enter the Fabric artifact.
sourceSets.main.java {
    srcDir '../src/main/java'
    include 'me/ichun/mods/morph/fabric/**'
    include 'me/ichun/mods/morph/model/**'
    include 'me/ichun/mods/morph/shape/**'
    include 'me/ichun/mods/morph/ability/**'
    include 'me/ichun/mods/morph/server/MorphSavedData.java'
    include 'me/ichun/mods/morph/server/MorphAuthority.java'
    include 'me/ichun/mods/morph/server/FormCapture.java'
    include 'me/ichun/mods/morph/server/MorphCommands.java'
    include 'me/ichun/mods/morph/network/CollectionProtocol.java'
    include 'me/ichun/mods/morph/network/AppearanceProtocol.java'
    include 'me/ichun/mods/morph/client/DescriptorState.java'
    include 'me/ichun/mods/morph/client/ClientCollectionState.java'
    include 'me/ichun/mods/morph/client/MorphRenderSnapshots.java'
    include 'me/ichun/mods/morph/client/MorphTransitions.java'
    include 'me/ichun/mods/morph/client/transition/**'
    include 'me/ichun/mods/morph/client/health/**'
    include 'me/ichun/mods/morph/client/equipment/**'
    include 'me/ichun/mods/morph/client/nametag/**'
    include 'me/ichun/mods/morph/client/animation/**'
    include 'me/ichun/mods/morph/ui/**'
    exclude 'me/ichun/mods/morph/ui/MorphUi.java'
}
sourceSets.test.java {
    srcDir '../src/test/java'
    include 'me/ichun/mods/morph/model/**'
    include 'me/ichun/mods/morph/ui/**'
    include 'me/ichun/mods/morph/client/ClientCollectionStateTest.java'
    include 'me/ichun/mods/morph/network/CollectionProtocolTest.java'
    include 'me/ichun/mods/morph/server/**'
    include 'me/ichun/mods/morph/ability/**'
    include 'me/ichun/mods/morph/client/transition/**'
    include 'me/ichun/mods/morph/client/animation/**'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('../src/main/resources') { include 'assets/morph/**'; include 'morph.animation.mixins.json' }
}
test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    from('../COPYING', '../COPYING.LESSER')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'morph-test'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Stable development identity makes save/rejoin testing repeatable.
sourceSets.gametest.java {
    srcDir '../src/main/java'
    srcDir '../testing/harness-common/src/main/java'
    include 'me/ichun/mods/morph/fabric/**'
    include 'me/ichun/mods/morph/lab/**'
    include 'me/ichun/mods/morph/gametest/NativeAttributeChecks.java'
}
loom.runs.client { programArgs '--username', 'MorphTester' }

// Opt-in harness routing; these classes remain in the test source set.
def morphLab = providers.gradleProperty('morphLab').map { it.toBoolean() }.getOrElse(false)
tasks.named('processGametestResources') {
    inputs.property('morphLab', morphLab)
    doLast {
        if (morphLab) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(metadata)
            data.entrypoints.'fabric-client-gametest' = ['me.ichun.mods.morph.fabric.lab.MorphLabClientGameTest']
            data.entrypoints.'fabric-gametest' = ['me.ichun.mods.morph.fabric.lab.MorphLabServerGameTests']
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}
loom.runs.configureEach {
    if (morphLab) {
        ['runDir', 'scenarios', 'role', 'server', 'events'].each { key ->
            def value = providers.gradleProperty('morph.lab.' + key).orNull
            if (value != null) property('morph.lab.' + key, value)
        }
        vmArg '-Xmx1536m'
    }
}
