plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = 'me.ichun.mods.morph'
base { archivesName = 'Morph-NeoForge-26.2' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
repositories { mavenCentral() }

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.test
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'morph.enableGameTests', 'true'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'morph'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        morph { sourceSet sourceSets.main }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('processResources', ProcessResources) {
    def properties = [mod_version: mod_version, neo_version: neo_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    from('COPYING', 'COPYING.LESSER')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Opt-in developer client bridge; lab classes are never part of the main JAR.
if (providers.gradleProperty('morphLab').map { it.toBoolean() }.getOrElse(false)) {
    sourceSets {
        lab {
            java.srcDir 'testing/harness-neoforge/src/main/java'
            java.srcDir 'testing/harness-common/src/main/java'
            resources.srcDir 'testing/harness-neoforge/src/main/resources'
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    neoForge.addModdingDependenciesTo(sourceSets.lab)
    neoForge.mods {
        morph_lab { sourceSet sourceSets.lab }
    }
    neoForge.runs {
        labServer {
            server()
            sourceSet = sourceSets.lab
            gameDirectory = layout.buildDirectory.dir('morph-lab/server').get().asFile
            systemProperty 'morph.lab.controlDir', layout.buildDirectory.dir('morph-lab/server-control').get().asFile.absolutePath
            systemProperty 'morph.lab.role', 'server'
            programArgument '--nogui'
            jvmArgument '-Xmx1024m'
        }
        labGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.lab
            gameDirectory = layout.buildDirectory.dir('morph-lab/server-tests').get().asFile
            systemProperty 'morph.lab.serverTests', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'morph_lab'
            def events = providers.gradleProperty('morph.lab.events').orNull
            if (events != null) systemProperty 'morph.lab.events', events
            jvmArgument '-Xmx1536m'
        }
        labClient {
            client()
            sourceSet = sourceSets.lab
            gameDirectory = layout.buildDirectory.dir('morph-lab/client').get().asFile
            systemProperty 'morph.lab.enabled', 'true'
            ['runDir', 'server', 'role', 'timeoutSeconds'].each { key ->
                def value = providers.gradleProperty('morph.lab.' + key).orNull
                if (value != null) systemProperty('morph.lab.' + key, value)
            }
            jvmArgument '-Xmx1536m'
            def gameDir = providers.gradleProperty('morph.lab.gameDir').orNull
            if (gameDir != null) gameDirectory = file(gameDir)
            programArgument '--username'
            programArgument providers.gradleProperty('morph.lab.username').getOrElse('MorphLabActor')
        }
    }
}
