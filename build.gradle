plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = 'me.ichun.mods.morph'
base { archivesName = 'Morph-NeoForge-26.2' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
repositories { mavenCentral() }

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.test
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'morph.enableGameTests', 'true'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'morph'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        morph { sourceSet sourceSets.main }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('processResources', ProcessResources) {
    def properties = [mod_version: mod_version, neo_version: neo_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    from('COPYING', 'COPYING.LESSER')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
